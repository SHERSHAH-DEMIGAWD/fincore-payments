global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: fincore-payments
    metrics_path: /internal/observability/prometheus
    follow_redirects: false
    body_size_limit: 5MB
    sample_limit: 20000
    label_limit: 12
    basic_auth:
      username_file: /run/secrets/metrics_username
      password_file: /run/secrets/metrics_password
    static_configs:
      - targets: ['host.docker.internal:8080']
